<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <title>IndexedDB ¡Base de Datos con JavaScript!</title>
  </head>
  <body>
    <section>
      <div class="encabezado">
        <did class="hijo-encabezado">
          <div class="texto-encabezado">
            IndexedDB ¡Base de Datos con JavaScript!
          </div>
        </did>
      </div>

      <div id="caja-padre">
        <div class="cont-form">
          <form id="formulario">
            <input type="text" id="nombre" placeholder="NOMBRE" required />
            <input type="text" id="id" placeholder="ID" />
            <input type="text" id="edad" placeholder="EDAD" />
          </form>
        </div>

        <div class="cont-boton">
          <div class="cont-hijo">
            <div class="padre-boton">
              <input type="button" id="btn-guardar" value="Guardar" />
            </div>
          </div>
        </div>
      </div>

      <div id="caja-padre">
        <div class="cont-form">
          <form id="formulario">
            <input
              type="text"
              id="ip-buscar"
              placeholder="Buscar por nombre..."
              required
            />
          </form>
        </div>
        <input type="button" class="search" id="btn-buscar" value="Buscar" />
        <div class="list-person">
          <div id="search-person"></div>
        </div>
      </div>

      <div id="caja-padre">
        <div class="hijo-encabezado">
          <div class="texto-encabezado">Lista de Personas Registradas</div>
        </div>
        <br />
        <div class="list-person">
          <div id="lista-personas">Aun no hay registros</div>
        </div>
      </div>
    </section>

    <script src="js/bd.js"></script>
  </body>
</html>
